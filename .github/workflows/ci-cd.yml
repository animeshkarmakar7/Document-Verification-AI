name: CI/CD Pipeline - LegalDoc AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Run Test Suite & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry Dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Syntax & Code Check
        run: |
          poetry run python -c "import ast; files = ['backend/app/services/vector_store_service.py', 'backend/app/services/rag_service.py', 'frontend/app.py']; [ast.parse(open(f, encoding='utf-8').read()) for f in files]; print('Syntax OK')"

      - name: Run Pytest Suite
        env:
          GEMINI_API_KEY: "mock-key-for-tests"
          DATABASE_HOST: "localhost"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "test_db"
          DATABASE_USER: "postgres"
          DATABASE_PASSWORD: "postgres"
        run: |
          poetry run pytest -v -m "not integration" --ignore=backend/tests/test_connection.py --ignore=backend/tests/test_document_repository.py

  deploy:
    name: Auto-Deployment Notification
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm Continuous Deployment Trigger
        run: |
          echo "✅ Tests passed! Main branch is ready for Streamlit Cloud and Render auto-deploy."
