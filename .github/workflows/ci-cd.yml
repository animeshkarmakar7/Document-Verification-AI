name: CI/CD Pipeline - LegalDoc AI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Stage 1: Test Suite ────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry (no virtualenv in CI)
        run: poetry config virtualenvs.create false

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Syntax Check
        run: |
          python -c "
          import ast, glob
          files = glob.glob('backend/**/*.py', recursive=True) + ['frontend/app.py']
          for f in files:
              try:
                  ast.parse(open(f, encoding='utf-8').read())
              except SyntaxError as e:
                  print(f'SYNTAX ERROR in {f}: {e}')
                  raise
          print(f'All {len(files)} files OK')
          "

      - name: Run Pytest
        env:
          GEMINI_API_KEY: "mock-key-for-tests"
          DATABASE_HOST: "localhost"
          DATABASE_PORT: "5432"
          DATABASE_NAME: "test_db"
          DATABASE_USER: "postgres"
          DATABASE_PASSWORD: "postgres"
          STORAGE_ENDPOINT: ""
          STORAGE_ACCESS_KEY: ""
          STORAGE_SECRET_KEY: ""
          STORAGE_BUCKET: "test-bucket"
          STORAGE_REGION: "us-east-1"
          APP_NAME: "LegalDoc AI"
          APP_VERSION: "1.0.0"
          ENVIRONMENT: "test"
        run: |
          pytest -v \
            --ignore=backend/tests/test_connection.py \
            --ignore=backend/tests/test_document_repository.py \
            -p no:warnings

  # ─── Stage 2: Deploy (only on push to main after tests pass) ────────────────
  deploy:
    name: Trigger Production Deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Notify Render Deploy
        run: |
          echo "✅ Tests passed. Render auto-deploys from main branch."
          echo "Backend API and DB: https://dashboard.render.com"
          echo "Frontend UI: https://share.streamlit.io"

      - name: Trigger Render Deploy Hook (optional)
        if: ${{ env.RENDER_DEPLOY_HOOK != '' }}
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
