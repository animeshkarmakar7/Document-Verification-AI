services:

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile

    container_name: legal-backend

    restart: unless-stopped

    environment:
      APP_NAME: Legal Document Intelligence
      APP_VERSION: 1.0.0
      ENVIRONMENT: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: legal_ai
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: legal_admin
      STORAGE_SECRET_KEY: change-this-password
      STORAGE_BUCKET: legal-documents
      STORAGE_REGION: us-east-1
      MAX_UPLOAD_SIZE_MB: 50
      LOG_LEVEL: INFO
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-large-en-v1.5}
      VECTOR_STORE_DIRECTORY: /app/.chroma_db
      QUEUE_BACKEND: ${QUEUE_BACKEND:-redis}
      DEDUP_CACHE_BACKEND: ${DEDUP_CACHE_BACKEND:-redis}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      INGESTION_QUEUE_NAME: document.ingestion

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - minio
      - redis

    volumes:
      - chroma_data:/app/.chroma_db


  postgres:
    image: postgres:16

    container_name: legal-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: legal_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  minio:
    image: minio/minio:latest

    container_name: legal-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: legal_admin
      MINIO_ROOT_PASSWORD: change-this-password

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


  redis:
    image: redis:7-alpine

    container_name: legal-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:

  postgres_data:

  minio_data:

  redis_data:

  chroma_data:
