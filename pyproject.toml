[project]
name = "legaldocai"
version = "0.1.0"
description = ""
package-mode = false
authors = [
    {name = "Animesh Karmakar",email = "animeshkarmakar992@gmail.com"}
]
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.19.0,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "uuid6 (>=2025.0.1,<2026.0.0)",
    "boto3 (>=1.43.67,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.35.0,<0.36.0)",
    "pypdf (>=6.0.0,<7.0.0)",
    "google-genai (>=1.19.0,<2.0.0)",
    "streamlit (>=1.61.1,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "chromadb (>=1.0.0,<2.0.0)",
    "sentence-transformers (>=3.0.0,<7.0.0)",
    "langchain-text-splitters (>=0.2.0,<2.0.0)",
    "langchain-community (>=0.2.0,<2.0.0)",
    "redis (>=5.0.0,<7.0.0)",
    "pika (>=1.3.0,<2.0.0)",
    "pypdfium2 (>=4.30.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.2,<0.17.0)",
    "httpx2 (>=2.9.1,<3.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

