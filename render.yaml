services:
  - type: web
    name: legaldocai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "pip install poetry && poetry install --only main --no-root"
    startCommand: "poetry run uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_CLASSIFICATION_BATCH_SIZE
        value: "10"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: DATABASE_HOST
        fromDatabase:
          name: legaldocai-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: legaldocai-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: legaldocai-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: legaldocai-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: legaldocai-db
          property: password
      - key: CELERY_BROKER_URL
        value: redis://red-placeholder:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://red-placeholder:6379/0
      - key: MAX_UPLOAD_SIZE_MB
        value: "50"
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: LegalDoc AI
      - key: APP_VERSION
        value: 1.0.0
      - key: STORAGE_ENDPOINT
        value: ""
      - key: STORAGE_ACCESS_KEY
        value: ""
      - key: STORAGE_SECRET_KEY
        value: ""
      - key: STORAGE_BUCKET
        value: legal-documents
      - key: STORAGE_REGION
        value: us-east-1

  - type: worker
    name: legaldocai-worker
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "pip install poetry && poetry install --only main --no-root"
    startCommand: "poetry run celery -A app.workers.celery_app.celery_app worker --loglevel=info --queues=cpu,gpu,analysis --workdir backend"
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_CLASSIFICATION_BATCH_SIZE
        value: "10"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama3-8b-8192
      - key: DATABASE_HOST
        fromDatabase:
          name: legaldocai-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: legaldocai-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: legaldocai-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: legaldocai-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: legaldocai-db
          property: password
      - key: CELERY_BROKER_URL
        value: redis://red-placeholder:6379/0
      - key: CELERY_RESULT_BACKEND
        value: redis://red-placeholder:6379/0
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production

databases:
  - name: legaldocai-db
    plan: free
    region: oregon
    databaseName: legal_ai
    user: legaldocai_user
